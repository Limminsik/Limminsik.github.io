<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minsik Lim</title>
<meta name="description" content="Minsik Lim — Ph.D. student in Computer Engineering at Gachon University. Medical data quality and biosignal AI.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2312151C%22/%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2232%22%20rx%3D%2225%22%20ry%3D%2210%22%20transform%3D%22rotate%28-24%2032%2032%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.45%22%20stroke-width%3D%221.6%22/%3E%3Cpath%20d%3D%22M19%2043V22l13%2015%2013-15v21%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2253.5%22%20cy%3D%2220.5%22%20r%3D%223.6%22%20fill%3D%22%23E8A93B%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--serif:"Source Serif 4","Noto Serif KR","Noto Serif CJK KR",Georgia,serif;--text:"Inter","Pretendard","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif}
:root,:root[data-theme="paper"]{
  --bg:#FAFAF8;--bg2:#F1F2F0;--card:#FFFFFF;--panel:rgba(255,255,255,.97);--line:rgba(17,20,28,.09);--line2:rgba(17,20,28,.18);
  --ink:#12151C;--ink2:#3E4452;--ink3:#7A8090;--on:#FFFFFF;--accent:#B4233C;
  --paper:#2F5BD3;--talk:#0E9384;--project:#E07A1F;--build:#D2335C;--milestone:#7552D6;--person:#9AA0AE;--org:#6B4FC0;
  --navbg:rgba(250,250,248,.88);--stage1:#FFFFFF;--stage2:#EEF0F5;--chipbg:rgba(255,255,255,.94);
  --orbit:rgba(17,20,28,.20);--halo:#FFFFFF;--sunc:#12151C;--suntext:#FFFFFF;--coretext:#FFFFFF;--star:#9097A8;--rowhot:#FFF4E8;
}
:root[data-theme="observatory"]{
  --bg:#0E1526;--bg2:#141D33;--card:#16203A;--panel:rgba(22,32,58,.97);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.22);
  --ink:#F3F5FA;--ink2:#C9CFDD;--ink3:#8E97AD;--on:#0E1526;--accent:#FF8A9B;
  --paper:#7FA2FF;--talk:#4FD1BE;--project:#FFB067;--build:#FF7D9C;--milestone:#B79CFF;--person:#9AA3B8;--org:#B79CFF;
  --navbg:rgba(14,21,38,.9);--stage1:#1A2644;--stage2:#0C1324;--chipbg:rgba(22,32,58,.92);
  --orbit:rgba(255,255,255,.24);--halo:#0F1729;--sunc:#FFD27A;--suntext:#0E1526;--coretext:#0E1526;--star:#DCE3F5;--rowhot:#22304F;
}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16.5px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 28px}
/* nav */
nav.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(8px);background:var(--navbg);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;height:62px;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font:500 20px var(--serif);white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on);display:grid;place-items:center;font:600 13px var(--serif);font-style:normal}
.navl{display:flex;gap:4px}.navl a{text-decoration:none;color:var(--ink2);font-size:15px;padding:6px 10px;border-radius:8px}.navl a:hover{color:var(--ink);background:var(--bg2)}
.navr{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{border:1px solid var(--line2);border-radius:8px;padding:7px 14px;font-size:14.5px;background:transparent;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill.solid{background:var(--ink);color:var(--on);border-color:var(--ink)}
.themebtn{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.themebtn button{border:0;background:none;padding:5px 11px;font-size:13px;color:var(--ink3)}
.themebtn button.on{background:var(--ink);color:var(--on)}
.themebtn .sm{display:none}
/* hero */
.hero{padding:72px 0 28px}
.herogrid{display:grid;grid-template-columns:230px 1fr;gap:52px;align-items:center}
.eyebrow{font:500 11.5px var(--text);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;gap:12px;align-items:center}
.eyebrow b{width:28px;height:1px;background:var(--accent)}
h1.hl{font:400 clamp(32px,4.4vw,58px)/1.08 var(--serif);letter-spacing:-.01em;margin:14px 0 18px}
h1.hl .nb span{font-style:italic;color:var(--accent)}
.lede{font-size:clamp(16px,1.3vw,17.5px);line-height:1.7;color:var(--ink2);max-width:none;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.portrait{margin:0;width:230px;height:280px;border-radius:12px;border:1px solid var(--line2);background:linear-gradient(160deg,var(--bg2),var(--card));display:grid;place-items:center;color:var(--ink3);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);margin-top:48px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line2)}
.kpi{padding:16px 6px 14px;border-right:1px solid var(--line);background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.kpi:last-child{border-right:0}.kpi:hover{background:var(--bg2)}
.kpi .v{font:600 38px/1 var(--serif)}.kpi .l{font:500 11.5px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
/* section heads */
.sec{padding:60px 0 0}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.shead h2{font:400 clamp(26px,3vw,36px)/1.15 var(--serif);margin:8px 0 0}
.shead h2 em{color:var(--accent)}
.shead p{color:var(--ink2);margin:10px 0 0;max-width:54ch;line-height:1.6}
/* stage */
.stagebox{position:relative;border:1px solid rgba(17,20,28,.25);border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -36px rgba(10,15,40,.55);
  --ink:#F3F5FA;--ink2:#C9CFDD;--ink3:#98A1B7;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.20);--panel:rgba(12,17,34,.86);--chipbg:rgba(12,17,34,.62);--halo:#05080F;--orbit:rgba(170,190,255,.22);--bg2:rgba(255,255,255,.07);--on:#0B0F1C;--accent:#FF9BAA;
  color:var(--ink);background:var(--nebula,none) center/cover no-repeat,radial-gradient(120% 90% at 50% 40%,#0E1430 0%,#070A18 55%,#03040A 100%)}
.stagebox .drawer,.stagebox .zlist,.stagebox .wcard,.stagebox .tip{backdrop-filter:blur(10px)}
.tw{animation:tw 3.8s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.9}50%{opacity:.15}}
.mlbl{font:500 12.5px var(--text);fill:#E8ECF6;paint-order:stroke;stroke:#05080F;stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.mlbl:hover,.mlbl.hot{fill:#FFD27A}
.mnum{font:700 10.5px var(--text);fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2.5px;pointer-events:none}
.wcard{position:absolute;left:14px;top:56px;z-index:3;width:300px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:none}
.wcard.on{display:block}
.wcard .wk{font:500 11px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);display:flex;gap:7px;align-items:center}
.wcard .wk i{width:9px;height:9px;border-radius:50%}
.wcard h4{margin:4px 0 4px;font:600 21px var(--serif)}
.wcard .ws{font-size:14px;color:var(--ink)}
.wcard .ws2{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.wcard .wl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.wcard .wl span{display:inline-flex;gap:5px;align-items:center}
.wcard .wl b{display:inline-block;width:10px;height:10px;border-radius:50%}
.wcard .wl b.o{background:#A6ABB8}.wcard .wl b.g{border:2px solid #F5C451}
#stage{display:block;width:100%;height:640px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stagebox:focus{outline:none}.stagebox:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.scard{position:absolute;left:38px;bottom:84px;z-index:3;max-width:430px;pointer-events:none}
.scard>*{opacity:0;transform:translateY(10px)}
.scard.on>*{animation:sc .7s cubic-bezier(.2,.8,.2,1) forwards}
.scard.on>*:nth-child(2){animation-delay:.08s}.scard.on>*:nth-child(3){animation-delay:.16s}.scard.on>*:nth-child(4){animation-delay:.2s}.scard.on>*:nth-child(5){animation-delay:.26s}
@keyframes sc{to{opacity:1;transform:none}}
.scard .se{font:500 12px var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);display:flex;gap:8px;align-items:center}
.scard .se i{width:9px;height:9px;border-radius:50%}
.scard h3{font:400 clamp(34px,4.4vw,54px)/1.04 var(--serif);margin:10px 0 12px;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.7)}
.scard .ss{font-size:16.5px;color:var(--ink);text-shadow:0 1px 12px rgba(0,0,0,.8)}
.scard .ss2{font-size:14px;color:var(--ink3);margin-top:3px;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.scard .sb{margin-top:18px;pointer-events:auto}
.land{border:0;border-radius:999px;padding:11px 20px;background:#F5F1E8;color:#10131C;font:600 15px var(--text);box-shadow:0 10px 30px -10px rgba(0,0,0,.7);cursor:pointer}
.land:hover{background:#fff}
.land2{margin-left:10px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:10px 16px;background:rgba(8,12,26,.45);color:var(--ink);font:500 14px var(--text);cursor:pointer;backdrop-filter:blur(6px)}
.land2:hover{border-color:rgba(255,255,255,.6)}
.dots .sundot{box-shadow:0 0 6px rgba(255,210,122,.8);background:rgba(255,210,122,.55)}
.dots{position:absolute;left:32px;bottom:24px;display:flex;gap:7px;align-items:center;z-index:3}
.dots .dot{width:9px;height:9px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.32);transition:width .3s,background .3s;cursor:pointer}
.dots .dot.on{background:var(--c);width:28px}
.dots .arw{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--chipbg);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}
.sunbtn{color:#FFE2A6}
.hud{position:absolute;left:14px;top:14px;display:flex;gap:8px;align-items:center;z-index:3}
.back{border:1px solid var(--line2);background:var(--chipbg);border-radius:999px;padding:5px 13px 5px 10px;font-size:13.5px}
.crumb{font-size:13.5px;color:var(--ink3)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:13px;color:var(--ink3);background:var(--chipbg);border:1px solid var(--line);padding:5px 13px;border-radius:999px;pointer-events:none;z-index:3;white-space:nowrap;transition:opacity .5s}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font:15px/1.4 var(--serif);color:var(--ink);max-width:300px;opacity:0;transition:opacity .15s;box-shadow:0 10px 24px -16px rgba(20,30,60,.5)}
.tip small{display:block;font:500 11px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.tip small.pre{margin:0 0 3px}
.tip.on{opacity:1}
/* svg */
.lbl{font:600 15px var(--text);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.sub{font:500 12.5px var(--text);fill:var(--ink3)}
.mnum{font:700 10.5px var(--text);fill:#fff;pointer-events:none}
.pl,.mn,.sun{cursor:pointer}
.mn .ring,.pl .ring{opacity:0;transition:opacity .2s}
.mn.sel .ring,.mn:hover .ring{opacity:1}
/* side list (focus) */
.zlist{position:absolute;top:60px;right:14px;bottom:60px;width:min(380px,40%);overflow:auto;z-index:3;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;display:none}
.zlist.on{display:block}
.zlist h4{margin:0 0 2px;font:600 20px var(--serif)}
.zlist .zm{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.zlist ol{list-style:none;margin:0;padding:0}
.zlist li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:baseline;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--ink2);cursor:pointer;border-radius:6px}
.zlist li:hover,.zlist li.hot{background:var(--bg2);color:var(--ink)}
.zlist li b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:700 10.5px var(--text)}
.zlist .zs{display:block;font-style:normal;font-size:12.5px;color:var(--ink3);margin-top:2px}
.zlist .y{font-size:12px;color:var(--ink3)}
/* drawer */
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:380px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;z-index:5;transform:translateX(112%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:auto;box-shadow:0 20px 50px -30px rgba(20,30,60,.5)}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--ink2)}
.kind{display:inline-flex;align-items:center;gap:8px;font:500 11.5px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kind i{width:9px;height:9px;border-radius:50%}
.drawer h3{font:600 23px/1.28 var(--serif);margin:10px 0 8px}
.meta{font-size:15px;color:var(--ink2);line-height:1.6}
.sect{font:500 11.5px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:13.5px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;background:transparent;color:var(--ink2)}
.rel{list-style:none;padding:0;margin:0}
.rel li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45;display:flex;gap:9px;align-items:baseline;cursor:pointer;color:var(--ink2)}
.rel li:hover{color:var(--accent)}
.rel li i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;transform:translateY(-1px)}
.open-full{margin-top:16px;width:100%;padding:11px;border-radius:10px;border:0;background:var(--ink);color:var(--on);font-size:15px;font-weight:600}
.tolist{margin-top:8px;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line2);background:none;font-size:14px;color:var(--ink2)}
/* table */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tbar input{flex:1 1 240px;border:1px solid var(--line2);border-radius:10px;padding:9px 13px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.filters button i{width:8px;height:8px;border-radius:50%}
.filters button.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.filters button .c{font-size:12px;opacity:.7}
.tcount{font-size:13px;color:var(--ink3);margin:0 0 8px}
.tw{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card)}
table.rec{width:100%;border-collapse:collapse;font-size:14.5px}
table.rec th{text-align:left;font:500 11.5px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 14px;border-bottom:1px solid var(--line2);background:var(--bg2);cursor:pointer;white-space:nowrap;user-select:none}
table.rec th .ar{opacity:.5;margin-left:4px}
table.rec td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2);line-height:1.45}
table.rec tr:last-child td{border-bottom:0}
table.rec tbody tr{cursor:pointer;transition:background .15s}
table.rec tbody tr:hover{background:var(--bg2)}
table.rec tbody tr.hot{background:var(--rowhot)}
table.rec td.t{color:var(--ink);font-weight:500}
table.rec td.y{white-space:nowrap;font-variant-numeric:tabular-nums}
.ty{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ty i{width:9px;height:9px;border-radius:50%}
.role{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.role.lead{background:var(--ink);color:var(--on);border-color:var(--ink)}
.goto{font-size:12.5px;color:var(--ink3);white-space:nowrap}
tr:hover .goto{color:var(--accent)}
/* full page */
.full{position:fixed;inset:var(--navh,63px) 0 0 0;z-index:25;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.full.open{transform:none}
.full .wrap{padding-top:34px;padding-bottom:80px;max-width:820px}
.full h2{font:400 clamp(24px,3vw,34px)/1.22 var(--serif);margin:14px 0 14px}
.full .bc{font-size:13px;color:var(--ink3)}
.fig{height:220px;border:1px dashed var(--line2);border-radius:12px;display:grid;place-items:center;color:var(--ink3);font-size:13px;margin:24px 0}
.full p{color:var(--ink2);line-height:1.7}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--line2);padding-top:18px}
.pn button{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:12px 14px;text-align:left;max-width:48%;color:var(--ink2);font-size:14px}
.pn button b{display:block;font:500 11px var(--text);letter-spacing:.08em;color:var(--ink3);margin-bottom:4px}
.closefull{position:fixed;right:20px;top:calc(var(--navh,63px) + 14px);z-index:26;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
footer{border-top:1px solid var(--line2);color:var(--ink3);font-size:14px;padding:28px 0 60px;margin-top:64px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.view{display:none}.view.on{display:block}
.nb{display:inline-block}
.abl{display:flex;flex-direction:column;gap:18px}
.roles{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.roles li{font:400 17px/1.35 var(--serif);font-style:italic;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--line2)}
.roles li:first-child{color:var(--accent)}
.ab .lede,.ab p{max-width:none}
.portrait{background:#dfe3ea url("assets/portrait.jpg") center 30%/cover;color:transparent;font-size:0;overflow:hidden}
.logo svg.lg{width:36px;height:36px;display:block}
#langbtn button{padding:5px 9px}
h1,h2,h3{text-wrap:balance}.ent h4{text-wrap:pretty}
:lang(ko) body{word-break:keep-all;--text:"Pretendard Variable","Pretendard","Noto Sans KR",system-ui,sans-serif}
.kt,:lang(ko) h1.hl,:lang(ko) .logo span{font-family:"Pretendard Variable","Pretendard","Noto Sans KR",system-ui,sans-serif!important;font-style:normal}

  if(isDay()){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1E55B0");g.addColorStop(.38,"#3F8BE0");g.addColorStop(.72,"#8CC6F5");g.addColorStop(.92,"#D9EEFC");g.addColorStop(1,"#FFEFDC");x.fillStyle=g;x.fillRect(0,0,W,H);
    const hz=x.createLinearGradient(0,H*.7,0,H);hz.addColorStop(0,"rgba(255,236,214,0)");hz.addColorStop(1,"rgba(255,226,196,.55)");x.fillStyle=hz;x.fillRect(0,H*.7,W,H*.3);cirrus(W,H);
    CLOUD.forEach(([u,v,wf,si,al,sp])=>{const sw=wf*Math.max(W,700),sh=sw*CSPR[si].height/CSPR[si].width,span2=W+sw*2;const cx=((u*span2+(reduce?0:now*.006*sp))%span2)-sw;x.globalAlpha=al;x.drawImage(CSPR[si],cx,v*H-sh/2,sw,sh)});x.globalAlpha=1}
  else{x.fillStyle="#02030A";x.fillRect(0,0,W,H);if(IMG.neb){const nw=Math.max(W*1.2,H*1.2*IMG.neb.width/IMG.neb.height),nh=nw*IMG.neb.height/IMG.neb.width;x.globalAlpha=.6;x.drawImage(IMG.neb,(W-nw)/2,(H-nh)/2,nw,nh);x.globalAlpha=1}
    STARS.forEach((s,i)=>{let a=s.a;if(s.tw&&!reduce)a*=.55+.45*Math.sin(now*.0016+i);x.globalAlpha=a;x.fillStyle="#fff";x.beginPath();x.arc(s.u*W,s.v*H,s.r,0,7);x.fill()});x.globalAlpha=1}}
function drawSun(S,now){const x=ctx,day=isDay();const R1=S.r*(day?4.2:3.4);const c=x.createRadialGradient(S.x,S.y,S.r*.8,S.x,S.y,R1);
  c.addColorStop(0,day?"rgba(255,244,214,.75)":"rgba(255,214,140,.5)");c.addColorStop(.3,day?"rgba(255,236,190,.25)":"rgba(255,170,80,.14)");c.addColorStop(1,"rgba(255,200,120,0)");x.fillStyle=c;x.beginPath();x.arc(S.x,S.y,R1,0,7);x.fill();
  if(S.x+S.r<0)return;x.save();x.beginPath();x.arc(S.x,S.y,S.r,0,7);x.clip();if(IMG.sun)x.drawImage(IMG.sun,S.x-S.r,S.y-S.r,2*S.r,2*S.r);if(day){x.fillStyle="rgba(255,250,225,.45)";x.fillRect(S.x-S.r,S.y-S.r,2*S.r,2*S.r)}x.restore()}
function sphere(img,cx,cy,r,rot,k){if(r<1)return;const x=ctx,day=isDay(),la=Math.atan2(L.sun.y-cy,L.sun.x-cx);
  const ac=day?"#FFFFFF":"#"+PSPEC[k].c[2];const ag=x.createRadialGradient(cx,cy,r*.96,cx,cy,r*1.16);ag.addColorStop(0,hexA(ac,day?.5:.36));ag.addColorStop(1,hexA(ac,0));x.fillStyle=ag;x.beginPath();x.arc(cx,cy,r*1.16,0,7);x.fill();
  x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();
  if(img){const w=img.width/2,h=img.height,off=((rot%1)+1)%1*w,cw=r>60?2:1,N=Math.ceil(2*r/cw);
    for(let i=0;i<N;i++){const u0=Math.max(-1,-1+i*cw/r),u1=Math.min(1,-1+(i+1)*cw/r);const s0=off+(Math.asin(u0)/Math.PI+.5)*w,s1=off+(Math.asin(u1)/Math.PI+.5)*w;x.drawImage(img,s0,0,Math.max(.5,s1-s0),h,cx+u0*r,cy-r,(u1-u0)*r+.8,2*r)}}
  else{x.fillStyle="#"+PSPEC[k].c[0];x.fillRect(cx-r,cy-r,2*r,2*r)}
  const lx=cx+Math.cos(la)*r*.5,ly=cy+Math.sin(la)*r*.5;const g=x.createRadialGradient(lx,ly,r*.05,cx-Math.cos(la)*r*.25,cy-Math.sin(la)*r*.25,r*1.25);
  g.addColorStop(0,"rgba(255,248,230,.22)");g.addColorStop(.42,"rgba(0,0,0,0)");
  if(day){g.addColorStop(.8,"rgba(60,100,160,.42)");g.addColorStop(1,"rgba(70,115,175,.7)")}else{g.addColorStop(.78,"rgba(2,4,12,.6)");g.addColorStop(1,"rgba(2,4,12,.88)")}
  x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r);x.restore()}
function ring(cx,cy,r,k,front){if(!PSPEC[k].ring)return;const x=ctx;x.save();x.translate(cx,cy);x.rotate(-.24);const a0=front?0:Math.PI,a1=front?Math.PI:2*Math.PI;
  [[1.42,.05,1,.4],[1.58,.09,2,.6],[1.74,.05,2,.4]].forEach(([q,lw,ci,al])=>{x.lineWidth=Math.max(1,r*lw);x.strokeStyle=hexA("#"+PSPEC[k].c[ci],al*(front?1:.6));x.beginPath();x.ellipse(0,0,r*q,r*q*.22,0,a0,a1);x.stroke()});x.restore()}

let visible=true;new IntersectionObserver(es=>{visible=es[0].isIntersecting}).observe(cv);
function frame(now){requestAnimationFrame(frame);if(!visible)return;
  const [W,H]=dims(),dpr=Math.min(2,devicePixelRatio||1);if(W<10||H<10)return;if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);L=null;TR=null}
  if(!L){L=layout(cur,grp);L.kind=cur;placeLabels()}
  if(TR){const t=Math.min(1,(now-TR.t0)/TR.d);L=lerpL(TR.from,TR.to,ease(t));if(t>=1){L=TR.to;TR=null}}
  const x=ctx;x.setTransform(dpr,0,0,dpr,0,0);HITS=[];drawBG(W,H,now);
  // orbit line (home)
  if(L.home>.02){x.globalAlpha=L.home*.5;x.strokeStyle="#fff";x.lineWidth=1;x.setLineDash([3,6]);x.beginPath();const a=homeSpot(0,W,H,isMobile()),b=homeSpot(4,W,H,isMobile()),m=homeSpot(2,W,H,isMobile());x.moveTo(L.sun.x+L.sun.r+10,a.y+6);x.quadraticCurveTo(m.x,2*m.y-(a.y+b.y)/2-4,b.x+60,b.y+8);x.stroke();x.setLineDash([]);x.globalAlpha=1}
  drawSun(L.sun,now);if(cur==="home")HITS.push({type:"sun",x:L.sun.x,y:L.sun.y,r:L.sun.r});
  const rot=reduce?0:now*.000006;
  KINDS.forEach((k,i)=>{const p=L.pl[k];if(p.a<.02)return;x.globalAlpha=p.a;ring(p.x,p.y,p.r,k,false);sphere(IMG[k],p.x,p.y,p.r,rot*(k===cur?1:3)+i*.2,k);ring(p.x,p.y,p.r,k,true);x.globalAlpha=1;
    if(hover&&hover.type==="pl"&&hover.k===k&&cur==="home"){x.strokeStyle="rgba(255,255,255,.8)";x.lineWidth=1.3;x.beginPath();x.arc(p.x,p.y,p.r+7,0,7);x.stroke()}
    if(cur==="home")HITS.push({type:"pl",k,x:p.x,y:p.y,r:Math.max(p.r+8,24)})});
  if(cur!=="home")L.mo.forEach((m,i)=>{x.globalAlpha=m.a;sphere(IMG["m"+cur],m.x,m.y,m.r,0,cur);if(i===grp){x.strokeStyle="#fff";x.lineWidth=1.8;x.beginPath();x.arc(m.x,m.y,m.r+5,0,7);x.stroke()}x.globalAlpha=1;HITS.push({type:"mo",i,x:m.x,y:m.y,r:m.r+10})});
  cv.style.cursor=hover?"pointer":"default"}

/* ---- HTML overlays ---- */
function placeLabels(){const T=layout(cur,grp),box=$("#alabels"),mob=isMobile();let h="";
  if(cur==="home")KINDS.forEach((k,i)=>{const p=T.pl[k];h+=`<button class="al" data-world="${k}" style="left:${p.x}px;top:${p.y+p.r+(PSPEC[k].ring?14:8)}px"><em>${i+1}</em><b>${NAME(k)}</b></button>`});
  else GR[cur].forEach((G,i)=>{const m=T.mo[i];h+=`<button class="gl${i===grp?" on":""}" data-grp="${i}" style="left:${m.x+m.r+8}px;top:${m.y}px"><b>${G.n}</b><span>${G.items.length}</span></button>`});
  box.innerHTML=h}
function renderHead(){const a=$("#ahead");
  if(cur==="home")a.innerHTML=`<h3>My universe</h3><p>${tx("Five worlds around me — pick one.","행성을 선택하면 해당 분야의 내용을 볼 수 있습니다.")}</p>`;
  else a.innerHTML=`<button class="bk" data-world="home">‹ My universe</button><h3>${STORY(cur)}</h3><p>${span(cur)} · ${ITEMS[cur].length} ${UNIT(cur)}</p>`;
  $("#anav").innerHTML=cur==="home"?"":`<button data-step="-1" aria-label="Previous">‹</button><button data-step="1" aria-label="Next">›</button>`}
function yearOf(r){return r.kind==="milestone"&&r.type==="deg"?Math.floor(r.t)+"–"+(r.end?String(Math.floor(r.end)).slice(2):""):r.kind==="project"?Math.floor(r.t)+(r.end&&Math.floor(r.end)!==Math.floor(r.t)?"–"+String(Math.floor(r.end)).slice(2):!r.end?"–":""):r.status?STAT(r.status).replace(/ \(.*/,""):Math.floor(r.t+1e-6)}
function renderPanel(){const p=$("#apanel");
  if(cur==="home"){if(isMobile()){p.innerHTML=`<div class="al2" style="margin-top:0">${KINDS.map((k,i)=>`<button class="arow" data-world="${k}"><span class="t">${i+1} · ${NAME(k)}</span><span class="y">${ITEMS[k].length}</span></button>`).join("")}</div>`;p.classList.add("on")}else p.classList.remove("on");return}
  const G=GR[cur][grp];
  p.innerHTML=`<div class="ah">${G.n}<span>${G.items.length}</span></div><div class="phint">${tx("Select a title for details","제목을 누르면 자세한 내용으로 이동합니다")}</div><div class="al2">${G.items.map(r=>`<button class="arow${r.id===hotRow?" hot":""}" data-entry="${r.id}"><span class="t${kt(lf(r,"title"))}">${lf(r,"title")}</span><span class="y">${yearOf(r)}</span></button>`).join("")}</div><div class="af"><a href="#" data-view="${PAGEOF[cur]}">${tx("Open the "+PAGENAME(PAGEOF[cur])+" page",PAGENAME(PAGEOF[cur])+" 페이지로 이동")} →</a></div>`;
  p.classList.remove("on");void p.offsetWidth;p.classList.add("on");
  const hot=p.querySelector(".arow.hot");if(hot)hot.scrollIntoView({block:"nearest"})}
function renderKpi(){document.querySelectorAll("#kpis .kpi").forEach(b=>b.classList.toggle("on",b.dataset.world===cur))}
function renderAll(){renderHead();renderPanel();renderKpi();placeLabels()}
function setCur(k,g){if(k===cur&&(g==null||g===grp))return;const same=k===cur;cur=k;grp=g||0;if(!same)hotRow=hotRow&&byId[hotRow].kind===k?hotRow:null;renderAll();go(reduce?1:(same?350:750))}
function step(d){setCur(SEQ[(SEQ.indexOf(cur)+d+SEQ.length)%SEQ.length])}
function openRecord(id){const r=byId[id];showView("home",{scroll:"atlas"});const g=Math.max(0,GR[r.kind].findIndex(G=>G.items.includes(r)));hotRow=id;if(cur===r.kind&&grp===g)renderPanel();else setCur(r.kind,g)}
function focusPlanet(k){setCur(k)}

/* ---- input ---- */
function hitAt(e){const b=cv.getBoundingClientRect(),X=e.clientX-b.left,Y=e.clientY-b.top;for(let i=HITS.length-1;i>=0;i--){const h=HITS[i];if(Math.hypot(h.x-X,h.y-Y)<=h.r)return h}return null}
let down=null;
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerup",e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;
  if(cur!=="home"&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){step(dx<0?1:-1);return}
  if(Math.hypot(dx,dy)<8){const h=hitAt(e);if(!h)return;if(h.type==="sun")showView("about");else if(h.type==="pl")setCur(h.k);else if(h.type==="mo")setCur(cur,h.i)}});
cv.addEventListener("pointermove",e=>{hover=hitAt(e)});cv.addEventListener("pointerleave",()=>{hover=null});
$("#stagebox").addEventListener("keydown",e=>{if(e.key==="ArrowRight"){step(1);e.preventDefault()}if(e.key==="ArrowLeft"){step(-1);e.preventDefault()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-world],[data-grp],[data-step],[data-entry]");if(!t)return;
  if(t.dataset.world){if(t.classList.contains("kpi")&&!$("#v-home").classList.contains("on"))showView("home",{scroll:"atlas"});setCur(t.dataset.world);return}
  if(t.dataset.grp){setCur(cur,+t.dataset.grp);return}
  if(t.dataset.step){step(+t.dataset.step);return}
  if(t.dataset.entry){showEntry(t.dataset.entry);return}});
addEventListener("resize",()=>{L=null;TR=null;renderPanel()});

/* ================= BOOT ================= */
const QP=new URLSearchParams(location.search);
if(QP.get("lang"))LANG=QP.get("lang")==="ko"?"ko":"en";
let th="paper";try{th=localStorage.getItem("pf-theme")||th}catch(_){}
renderStatic();setTheme(QP.get("theme")||th);renderPages();
if(QP.get("world")&&SEQ.includes(QP.get("world")))cur=QP.get("world");
renderAll();requestAnimationFrame(frame);
if(QP.get("view"))showView(QP.get("view"));
if(QP.get("scroll"))setTimeout(()=>document.getElementById(QP.get("scroll")).scrollIntoView({behavior:"instant"}),50);
</script>
</body>
